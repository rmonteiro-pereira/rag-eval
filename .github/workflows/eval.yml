# =============================================================================
# LIVE since 2026-07-31. Green on its first run, and on every run since.
#
# This file was written and committed while `rag-eval` was still remote-less —
# a local `main` with no `origin` — precisely because a CI gate written after
# the first regression is a CI gate that missed the first regression. It sat
# here unrun until the repository was published.
#
# It then ran, unmodified, and passed:
#
#     run 30599034168 · 2026-07-31T02:27:47Z · 1m03s   (PRE-MYPY)
#       tests + lint             success   ruff clean, 278 passed, 3 deselected
#       regression gate          success   BOTH steps, including the one that
#                                          requires the gate to FAIL
#       full ablation (manual)   skipped   workflow_dispatch-only, as designed
#
# That run predates the `ruff format --check` and `mypy` steps below, so its
# summary reports neither — it is a historical record of the workflow's first
# green build, not of the job as it now stands. Test counts move with the tests
# and are not maintained here; `uv run pytest -q` is the source of truth.
#
# 278 + 3 deselected: the three `integration` tests need a live Qdrant, which CI
# does not have. They are deselected explicitly rather than left to self-skip, so
# a skip cannot be read as a pass.
#
# The same three commands are what hold the line locally:
#
#     uv run pytest -q
#     uv run ruff check .
#     uv run python -m eval.regression_gate \
#         --baseline eval/reports/ablation.json \
#         --candidate eval/reports/ablation.json
#
# The `unit` job needs no services and no models. The `eval-gate` job is split
# in two on purpose:
#
#   * `gate-selfcheck` re-runs the committed report against itself plus the
#     degraded fixture. It is hermetic: no Qdrant, no Ollama, no model weights,
#     a few seconds. This is the job required for merge — `main` carries branch
#     protection with `regression gate (hermetic)` as its required status check,
#     which is checkable with
#     `gh api repos/rmonteiro-pereira/rag-eval/branches/main/protection`.
#     `enforce_admins` is off, so the repository owner can still push directly;
#     the required check is a gate on merges, not a lock on the owner.
#   * `eval-full` regenerates the ablation from scratch and needs Qdrant, ~2.5 GB
#     of model weights and the ingested corpus. It is `workflow_dispatch` only,
#     because putting a 20-minute CPU-bound job with a model download on every PR
#     is how a gate gets disabled.
#
# The corpus itself is not in git (only `data/manifest.json` is), so `eval-full`
# has to re-download 30 PDFs from bcb.gov.br. That is a third-party dependency in
# CI and a reason more to keep it off the PR path.
# =============================================================================

name: eval

# `push` covers every branch, not only main. On 2026-07-31 GitHub stopped
# delivering `pull_request` events for this repository (opened, reopened and
# synchronize on PR #10 all created no run, while `push` to main and
# `workflow_dispatch` kept working; the workflow file was unchanged since #7
# and had fired for #9 minutes earlier; Actions enabled, nothing awaiting
# approval). A PR whose checks silently never start still *looks* green-ish —
# only unrelated apps report — which is exactly the "green because it checks
# nothing" failure this workflow exists to prevent. Triggering on every branch
# push means dropped PR events can no longer leave a PR without CI evidence;
# the cost is a duplicate run per push while PR events are healthy.
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_full_eval:
        description: "Regenerate the ablation from scratch (slow, needs Qdrant + models)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  UV_LINK_MODE: copy

jobs:
  unit:
    name: tests + lint + types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: sync
        run: uv sync --extra dev

      - name: ruff (lint)
        run: uv run ruff check .

      - name: ruff (format)
        run: uv run ruff format --check .

      # Not `--strict`. What is enforced is the class of error that actually bit
      # this repo: Optional flowing into code that assumes it is present, which
      # is how the demo writer ended up dereferencing a `None` gate decision.
      - name: mypy
        run: uv run mypy

      # Integration tests are marked and skip themselves when Qdrant is absent,
      # which it is here. Deselecting them explicitly means a skip cannot be
      # mistaken for a pass in the summary.
      - name: pytest
        run: uv run pytest -q -m "not integration"

  gate-selfcheck:
    name: regression gate (hermetic)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --extra dev

      # 1. The committed report must pass against itself. Catches a corrupted
      #    or truncated report, and a gate that has stopped comparing anything.
      - name: gate passes on the committed report
        run: |
          uv run python -m eval.regression_gate \
            --baseline eval/reports/ablation.json \
            --candidate eval/reports/ablation.json

      # 2. The gate must FAIL on the deliberately degraded fixture. Without this
      #    step the gate could be inverted, or always return 0, and step 1 would
      #    still be green forever.
      - name: gate fails on the degraded fixture
        run: |
          set +e
          uv run python -m eval.regression_gate \
            --baseline tests/fixtures/gate_baseline.json \
            --candidate tests/fixtures/gate_degraded.json
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "::error::the gate returned $status on the degraded fixture; expected 1"
            exit 1
          fi
          echo "gate correctly rejected the degraded fixture"

  mutation:
    name: mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --extra dev

      # ~30 seconds. This job exists because a mutation setup that never runs is
      # worse than none: it implies a check the reader has no way to know did not
      # happen. There is no `if:` on this job for the same reason.
      - name: mutmut run
        run: uv run mutmut run --max-children 4

      # A floor, not a pin. Adding a test must never fail the build, and the
      # number legitimately moves when the mutated code does. It fails on a drop,
      # and — the case that matters — it fails when NOTHING was covered, because
      # 0 killed / 0 covered is undefined rather than perfect. That is exactly
      # what a config pointed at paths which do not exist produces.
      - name: gate on the score
        run: uv run python -m tools.mutation_survivors --check-score 70

      # The score has to trace to a file a reader can open, like every other
      # number this project publishes. Regenerate the artifact and diff it: if
      # the run moved and `eval/reports/mutation.json` did not, the docs are
      # quoting a number nothing produces.
      - name: the committed mutation artifact is current
        run: |
          uv run python -m tools.mutation_survivors --write-json /tmp/mutation.json
          diff -u eval/reports/mutation.json /tmp/mutation.json             || { echo "::error::eval/reports/mutation.json is stale — regenerate it"; exit 1; }

      # The committed inventory must match the run. If a survivor appears or is
      # killed and `docs/mutation-survivors.md` was not regenerated, the docs are
      # describing a different codebase.
      - name: the committed survivor list is current
        run: |
          uv run python -m tools.mutation_survivors > /tmp/survivors.md
          diff -u docs/mutation-survivors.md /tmp/survivors.md \
            || { echo "::error::docs/mutation-survivors.md is stale — regenerate it"; exit 1; }

  # ---------------------------------------------------------------------------
  # UNVERIFIED. This job has been *skipped* on every run so far and has never
  # executed a single step. `workflow_dispatch` + a 60-minute CPU job with a
  # 2.5 GB model download is the right trade for the PR path, but it means the
  # ingest, the regeneration, the gate-against-baseline and the artifact upload
  # below are written and unproven. Treat a green workflow as saying nothing
  # about this job until someone dispatches it with `run_full_eval: true`.
  # ---------------------------------------------------------------------------
  eval-full:
    name: full ablation (manual, never yet executed)
    if: github.event_name == 'workflow_dispatch' && inputs.run_full_eval
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      qdrant:
        image: qdrant/qdrant:v1.18.1
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --extra dev

      - name: cache model weights
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-m3-reranker-base

      # Re-downloads the corpus from bcb.gov.br using the committed manifest.
      - name: ingest
        env:
          QDRANT_URL: http://localhost:6333
        run: uv run python -m ingest.pipeline --download 30

      - name: regenerate the ablation
        env:
          QDRANT_URL: http://localhost:6333
        run: uv run python -m eval.ablation --out /tmp/ablation.json

      - name: gate the fresh report against the committed baseline
        run: |
          uv run python -m eval.regression_gate \
            --baseline eval/reports/ablation.json \
            --candidate /tmp/ablation.json

      # `include-hidden-files` is deliberately NOT set here, and that is a
      # checked decision rather than an omission. upload-artifact v4 silently
      # excludes dot-prefixed paths, which has bitten a sibling project; this
      # path is `/tmp/ablation.json`, with no hidden component and no hidden
      # parent inside the upload root, so the flag would be noise. If the path
      # ever moves under a dot-directory, the flag becomes mandatory and the
      # failure is a *missing artifact*, not a red job.
      #
      # `if-no-files-found` is left at its `warn` default on purpose: this step
      # runs `if: always()`, so on a failed ingest there is legitimately nothing
      # to upload and the job should not fail twice for one cause.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ablation-report
          path: /tmp/ablation.json
