# Dependency updates.
#
# Deliberately quiet. A portfolio repository that opens eight PRs a week and
# merges none reads worse than one with no automation at all — the PR list is
# the first thing a reviewer sees, and a wall of stale bot PRs says nobody is
# home. So: monthly, grouped, and capped.
#
# NOTE: this file configures *version updates* only. **Dependabot security
# alerts are a repository setting and are currently OFF** — `GET
# /repos/.../vulnerability-alerts` returns 404 and the alerts API returns
# "Dependabot alerts are disabled for this repository". No file in this repo can
# turn them on; it is a toggle in Settings → Code security. They are worth
# enabling, and they are a separate decision from this file.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
    groups:
      # One PR for the routine noise. Anything major arrives on its own, because
      # a grouped major is a PR nobody reads carefully.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Pinned by argument, not by accident — see docs/adr/0009-cpu-torch-over-cuda-wheels.md.
      # A bot bumping torch across a major line would silently change the build
      # the reproducibility claim rests on.
      - dependency-name: "torch"
        update-types: ["version-update:semver-major"]
      # Kept in step with the Qdrant image in docker-compose.yml by hand; the
      # client refuses to vouch for a server more than one minor away, so an
      # automated bump breaks retrieval rather than a test.
      - dependency-name: "qdrant-client"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The spaCy Portuguese model is pinned by release-wheel URL. Dependabot
      # cannot resolve it and a bump would silently drop the PII backend to
      # regex — see docs/REPRODUCE.md step 2b.
      - dependency-name: "pt-core-news-sm"
