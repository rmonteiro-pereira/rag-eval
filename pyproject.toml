[project]
name = "rag-eval"
version = "0.1.0"
description = "Production-grade RAG over Brazilian financial regulatory documents, with a rigorous evaluation harness."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Rodrigo Monteiro Pereira" }]

dependencies = [
    # corpus acquisition + parsing
    "httpx>=0.27",
    "pypdf>=5.1",
    # embeddings (bge-m3, local CPU)
    "sentence-transformers>=3.3",
    "torch>=2.4",
    # vector store
    # keep the minor version in step with the qdrant image in docker-compose.yml
    "qdrant-client>=1.18,<1.19",
    # observability
    "langfuse>=2.53,<3",
    # generation / config / cli
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "typer>=0.15",
    "rich>=13.9",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    # Presidio's Portuguese NLP engine. The model is a wheel published on GitHub
    # rather than a PyPI package, so it is pinned by URL: without it
    # `guardrails/pii.py` silently falls back to the regex backend and the
    # measured PII numbers stop being the ones in eval/reports/adversarial.json.
    "spacy>=3.8,<3.9",
    "pt-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/pt_core_news_sm-3.8.0/pt_core_news_sm-3.8.0-py3-none-any.whl",
    "duckdb>=1.5.5",
    "fastapi>=0.140.13",
    "uvicorn[standard]>=0.51.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.8", "pytest>=8.3", "mypy>=1.13", "mutmut>=3.6"]

[project.scripts]
rag-ask = "rag.ask:main"
rag-ingest = "ingest.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# The spaCy Portuguese model is published as a GitHub release wheel, not on PyPI,
# so it has to be pinned by URL. Hatchling refuses direct references unless this
# is set.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# Flat layout: the repo structure mandated by the spec doubles as the package set.
packages = ["rag", "ingest", "retrieval", "generation", "serving", "eval", "guardrails", "governance", "agent"]
# `tools/` is dev tooling, not shipped in the wheel.

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the live docker-compose stack (Qdrant); skipped when it is down",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# W605 added after an invalid escape sequence in a docstring (`\[` outside a
# raw string) shipped unnoticed: ruff was clean, and only `ast.parse` in the
# mutation-config test surfaced the DeprecationWarning. It is a SyntaxError in
# a future Python, so it is worth a rule rather than a memory.
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.11"
files = ["rag", "retrieval", "generation", "guardrails", "governance", "agent", "ingest", "eval", "serving", "tools"]
# The scientific stack (torch, sentence-transformers, presidio, qdrant-client)
# ships partial or absent stubs. Following imports into them produces noise about
# third-party internals, not about this repository's code.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
# Deliberately NOT strict: `disallow_untyped_defs` on a codebase with this much
# numeric plumbing buys ceremony, not safety. What is turned on is the class of
# error that actually bit here — Optional flowing into code that assumes it is
# present, which is how the HITL gate ended up dereferencing a `None` decision.
strict_optional = true
no_implicit_optional = true

# Mutation testing. Scoped, and the scope is an argument rather than a
# convenience: these are the modules where a passing test suite is least
# reassuring, because they are pure ranking arithmetic whose bugs produce
# plausible numbers instead of exceptions. `retrieval/{store,configs,rerank}.py`
# are deliberately absent — they need live Qdrant and 2.5 GB of model weights, so
# mutants there would measure the absence of integration tests in the runner,
# not the quality of the unit tests. That exclusion is reported alongside the
# score in docs/mutation.md rather than left for a reader to discover.
[tool.mutmut]
source_paths = [
    "retrieval/text.py",
    "retrieval/sparse.py",
    "retrieval/fusion.py",
    "retrieval/metadata.py",
    "eval/scoring.py",
    "eval/probes.py",
    "eval/regression_gate.py",
]
# mutmut runs pytest from a copied `mutants/` tree, so anything the selected
# tests import has to travel with them.
also_copy = [
    "rag",
    "eval",
    "retrieval",
    "generation",
    "ingest",
    "tests/fixtures",
    "eval/datasets",
    "eval/reports",
    "data",
    "pyproject.toml",
]
# Only the tests that exercise the mutated modules. Running the whole suite per
# mutant would multiply LLM-free but slow tests across ~700 mutants for no signal:
# a mutant in `fusion.py` cannot be caught by a test that never imports it, and
# counting those runs as "survived elsewhere" would flatter nothing and cost hours.
pytest_add_cli_args_test_selection = [
    "tests/test_text.py",
    "tests/test_sparse.py",
    "tests/test_metadata.py",
    "tests/test_probes.py",
    "tests/test_qrels.py",
    "tests/test_retrieval_metrics.py",
    "tests/test_regression_gate.py",
    "tests/test_generation_metrics.py",
    "tests/test_scoring.py",
    "tests/test_significance.py",
]
