name: rag-eval

# Local, free, self-hosted infrastructure for the RAG stack.
#   qdrant    -> vector store          http://localhost:6333/dashboard
#   langfuse  -> tracing / observability  http://localhost:3000
#   postgres  -> langfuse metadata store (internal only)
#
# Langfuse is pinned to the v2 line: it needs only Postgres, which keeps the
# local footprint small (v3 additionally requires ClickHouse + Redis + MinIO).

services:
  qdrant:
    # Keep in step with `qdrant-client` in pyproject.toml — the client refuses to
    # vouch for a server more than one minor version away.
    image: qdrant/qdrant:v1.18.0
    container_name: rag-eval-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST + dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__ENABLE_TLS: "false"
      QDRANT__TELEMETRY_DISABLED: "true"
    healthcheck:
      # the qdrant image is distroless: no curl/wget, but it ships a CLI probe
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: rag-eval-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  langfuse:
    image: langfuse/langfuse:2
    container_name: rag-eval-langfuse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      # Local-only development secrets. Not sensitive: this stack never leaves
      # the machine and holds no real user data.
      NEXTAUTH_SECRET: local-dev-nextauth-secret-change-me
      SALT: local-dev-salt-change-me
      # Must stay quoted: an unquoted hex string of digits is parsed as a YAML
      # integer and reaches the container mangled.
      ENCRYPTION_KEY: "5c2b8f1a9d3e47061b8c4a7f2e9d05c3a6178b4e2f9c0d5a8b3e6f1c4d7092ab"
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      # Auto-provision an org/project/user + API keys on first boot so the
      # pipeline can trace without anyone clicking through the UI.
      LANGFUSE_INIT_ORG_ID: rag-eval
      LANGFUSE_INIT_ORG_NAME: rag-eval
      LANGFUSE_INIT_PROJECT_ID: rag-eval
      LANGFUSE_INIT_PROJECT_NAME: rag-eval
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-rag-eval-local
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-rag-eval-local
      LANGFUSE_INIT_USER_EMAIL: local@rag-eval.dev
      LANGFUSE_INIT_USER_NAME: Local
      LANGFUSE_INIT_USER_PASSWORD: ragevallocal123
    healthcheck:
      # Self-probe via the compose service name, not localhost/127.0.0.1: the
      # Next.js server binds to the container's network IP only, so loopback
      # gets connection-refused even while the service is perfectly healthy.
      test:
        ["CMD", "wget", "--spider", "-q", "http://langfuse:3000/api/public/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

volumes:
  qdrant_storage:
  postgres_data:
